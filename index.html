<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>@work · Seu próximo negócio pode estar ao seu lado</title>
<meta name="description" content="A rede profissional de quem está por perto. Fique visível onde estiver e descubra o que cada um faz, oferece e procura.">
<meta name="theme-color" content="#08090B">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%2308090B'/%3E%3Cpath d='M82 50A32 32 0 1 0 72.6 72.6' fill='none' stroke='%23F3F4F6' stroke-width='8' stroke-linecap='round'/%3E%3Ccircle cx='50' cy='50' r='10' fill='%237DF0C8'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600&family=Unbounded:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#08090B;--line:#262A31;--fg:#E6E8EB;--white:#F3F4F6;--muted:#8A909B;--brand:#7DF0C8}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:400 17px/1.6 Manrope,-apple-system,system-ui,'Segoe UI',sans-serif;display:flex;flex-direction:column;min-height:100%}
.wrap{width:100%;max-width:960px;margin:0 auto;padding:0 24px}
header{padding:32px 0}
.logo{display:inline-flex;align-items:center;gap:10px;font:400 26px/1 Unbounded,sans-serif;color:var(--white)}
.logo svg{width:32px;height:32px}
main{flex:1;display:flex;align-items:center;padding:32px 0 72px}
h1{margin:0;max-width:17ch;font:500 clamp(34px,6.4vw,64px)/1.08 Unbounded,sans-serif;letter-spacing:-.025em;color:var(--white)}
h1 span{color:var(--muted)}
.lead{margin:28px 0 0;max-width:34em;font-size:clamp(17px,2.2vw,20px);color:var(--muted)}
.soon{display:inline-flex;align-items:center;gap:10px;margin:36px 0 0;font-weight:600;color:var(--fg)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--brand)}
footer{border-top:1px solid var(--line);padding:24px 0;font-size:14px;color:var(--muted)}
</style>
</head>
<body>
<header><div class="wrap">
  <div class="logo" aria-label="@work">
    <svg viewBox="0 0 100 100" aria-hidden="true"><path d="M88 50A38 38 0 1 0 76.87 76.87" fill="none" stroke="#F3F4F6" stroke-width="9" stroke-linecap="round"/><circle cx="50" cy="50" r="11" fill="#7DF0C8"/></svg>
    work
  </div>
</div></header>
<main><div class="wrap">
  <h1>Seu próximo negócio <span>pode estar ao seu lado.</span></h1>
  <p class="lead">Fique visível onde estiver e descubra quem está por perto: o que cada um faz, oferece e procura.</p>
  <p class="soon"><span class="dot"></span>Em breve para iPhone</p>
</div></main>
<footer><div class="wrap">© 2026 @work</div></footer>
</body>
</html>
